name: Paper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Debug Polymarket connectivity
        run: |
          python -c "
          import polymarket_paper_bot as b
          w = b.window_ts()
          m = b.get_market(w)
          print('market found:', bool(m), m.get('slug') if m else None)
          if m:
              import json
              tokens = json.loads(m['clobTokenIds'])
              print('price ok:', b.get_token_price(tokens[0]))
          "

      - run: python polymarket_paper_bot.py

      - name: Commit and push log
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_trades.jsonl
          git diff --cached --quiet || git commit -m "update paper trades log"
          git pull --rebase origin main
          git push
